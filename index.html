<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gann Price Projection</title>
    <meta name="description" content="Gann Price-Time Projection Calculator">
    <meta name="theme-color" content="#0b0e14">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="icon-192.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icon-192.svg">
</head>
<body>
    <div class="container">
        <header>
            <h1>Gann Price Projection</h1>
            <p class="subtitle">Price&ndash;Time Projection Calculator</p>
        </header>

        <main>
            <section class="input-panel">
                <div class="form-group">
                    <label for="ref-price">Reference Price</label>
                    <input type="number" id="ref-price" placeholder="e.g. 12345" step="any" required>
                </div>

                <div class="form-group">
                    <label for="div-factor">Dividing Factor</label>
                    <select id="div-factor">
                        <option value="10">10</option>
                        <option value="100" selected>100</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="max-interval">Maximum Time Interval</label>
                    <div class="interval-controls">
                        <input type="number" id="max-interval" value="1.00" step="0.25" min="0.25" required>
                        <div class="presets">
                            <button type="button" class="preset-btn" data-val="1.00">1.0</button>
                            <button type="button" class="preset-btn" data-val="2.00">2.0</button>
                            <button type="button" class="preset-btn" data-val="3.00">3.0</button>
                            <button type="button" class="preset-btn" data-val="5.00">5.0</button>
                        </div>
                    </div>
                </div>

                <div class="actions">
                    <button id="btn-calc" class="btn primary">Calculate</button>
                    <button id="btn-reset" class="btn secondary">Reset</button>
                </div>
                
                <div id="validation-msg" class="validation-msg hidden"></div>
            </section>

            <section id="results-panel" class="results-panel hidden">
                <div class="summary">
                    <div class="summary-item">Ref Price: <span id="summ-ref"></span></div>
                    <div class="summary-item">Div Factor: <span id="summ-div"></span></div>
                    <div class="summary-item">Normalized: <span id="summ-norm"></span></div>
                </div>
                <div id="outdated-warning" class="outdated-warning hidden">Inputs changed. Press Calculate to update.</div>
                
                <div class="table-responsive">
                    <table id="projection-table">
                        <thead>
                            <tr>
                                <th>Time Interval</th>
                                <th class="upside-header">Upside Projection</th>
                                <th class="downside-header">Downside Projection</th>
                            </tr>
                        </thead>
                        <tbody id="table-body">
                            <!-- Rows generated dynamically -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
